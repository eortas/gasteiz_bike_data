name: Daily ML Model Retraining (MLOps)

on:
  schedule:
    - cron: '0 3 * * *' # Se ejecuta automáticamente todas las noches a las 03:00 AM UTC
  #   - cron: '0 3 * * *' # Desactivamos la ejecución automática diaria
  workflow_dispatch: # Permite ejecutar el reentrenamiento manualmente desde GitHub en cualquier momento
permissions:
  contents: write

concurrency:
  group: repository-write
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obtenemos el historial completo

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Convertir a Parquet Comprimido
        run: python convertir_a_parquet.py

      - name: Generar Features para ML
        run: python preparar_features.py

      - name: Reentrenar Modelo LightGBM
        run: python modelo_prediccion.py

      - name: Calcular Análisis de Inactividad de Estaciones
        run: python analisis_estaciones.py

      - name: Ejecutar Simulación de Impacto ML (Diurna y 24h)
        run: python simular_redistribucion.py

      - name: Auditar Disponibilidad de Flota (Censo 4AM y Ventana de Seguridad)
        run: |
          python analisis_flota_4am.py
          python analizar_todos_dias_ventana.py

      - name: Guardar y Subir Resultados y Modelo Actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Descartamos cambios accidentales en los CSV de datos para no colisionar con el scraper
          git checkout -- datos/*.csv historico.csv 2>/dev/null || true
          git add datos/*.parquet features_historico.csv meteo_historica.csv modelo_lightgbm.joblib metricas_modelo.json resumen_*.csv resumen_*.json matriz_distancias_estaciones.csv 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(mlops): reentrenamiento diario ML, auditoría de flota y actualización de métricas [skip ci]" && git pull --rebase origin main && git push origin HEAD:main)


