name: Daily ML Model Retraining (MLOps)

on:
  schedule:
    - cron: '0 3 * * *' # Se ejecuta automáticamente todas las noches a las 03:00 AM UTC
  workflow_dispatch: # Permite ejecutar el reentrenamiento manualmente desde GitHub en cualquier momento

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obtenemos todo el historial de commits para reconstruir.py

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruir Histórico Completo
        run: python reconstruir.py

      - name: Generar Features para ML
        run: python preparar_features.py

      - name: Reentrenar Modelo LightGBM
        run: python modelo_prediccion.py

      - name: Guardar y Subir Modelo Actualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add modelo_lightgbm.joblib features_historico.csv historico.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(mlops): reentrenamiento diario del modelo LightGBM [skip ci]" && git push)
