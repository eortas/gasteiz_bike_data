name: Daily ML Model Retraining (MLOps)

on:
  schedule:
    - cron: '0 3 * * *' # Se ejecuta automáticamente todas las noches a las 03:00 AM UTC
  workflow_dispatch: # Permite ejecutar el reentrenamiento manualmente desde GitHub en cualquier momento

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obtenemos todo el historial de commits para reconstruir.py

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruir Histórico Completo CSV
        run: python reconstruir.py

      - name: Convertir a Parquet Comprimido
        run: python convertir_a_parquet.py

      - name: Generar Features para ML
        run: python preparar_features.py

      - name: Reentrenar Modelo LightGBM
        run: python modelo_prediccion.py

      - name: Calcular Análisis de Inactividad de Estaciones
        run: python analisis_estaciones.py

      - name: Ejecutar Simulación de Impacto ML (Diurna y 24h)
        run: python simular_redistribucion.py

      - name: Auditar Disponibilidad de Flota (Censo 4AM y Ventana de Seguridad)
        run: |
          python analisis_flota_4am.py
          python analizar_todos_dias_ventana.py

      - name: Guardar y Subir Resultados y Modelo Actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore(mlops): reentrenamiento diario ML, auditoría de flota y actualización de métricas [skip ci]" && git pull --rebase --autostash origin main && git push)


